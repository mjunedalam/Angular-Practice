<div class="log-indicator">
  <div class="log-indicator__buttons">

    <button
      class="log-btn"
      [ngClass]="store.wellsLogsIndicators()?.rcc ? 'log-btn--active' : 'log-btn--inactive'"
      [disabled]="!store.wellsLogsIndicators()?.rcc"
      [title]="store.wellsLogsIndicators()?.rcc ? 'RCC remarks available' : 'No RCC remarks'"
    >
      <span class="log-btn__dot"></span>
      RCC
    </button>

    <button
      class="log-btn"
      [ngClass]="store.wellsLogsIndicators()?.mudLog ? 'log-btn--active' : 'log-btn--inactive'"
      [disabled]="!store.wellsLogsIndicators()?.mudLog"
      [title]="store.wellsLogsIndicators()?.mudLog ? 'Mud log remarks available' : 'No mud log remarks'"
    >
      <span class="log-btn__dot"></span>
      Mud Log
    </button>

    <button
      class="log-btn"
      [ngClass]="store.wellsLogsIndicators()?.logging ? 'log-btn--active' : 'log-btn--inactive'"
      [disabled]="!store.wellsLogsIndicators()?.logging"
      [title]="store.wellsLogsIndicators()?.logging ? 'Logging remarks available' : 'No logging remarks'"
    >
      <span class="log-btn__dot"></span>
      Logging
    </button>

  </div>
</div>
