<div class="presentation">

  <!-- ── Chip bar ────────────────────────────────────────────────────────────── -->
  <div class="presentation__toolbar">
    <app-well-name-chips class="toolbar__chips" />
  </div>

  @if (store.error()) {
    <p-message severity="error" [text]="store.error()!" styleClass="pres-error-banner" />
  }

  <!-- ── SKELETON — shown during any loading state ──────────────────────────── -->
  @if (store.loading()) {
    <div class="pres-skeleton-wrap">
      <app-presentation-skeleton />
    </div>
  }

  <!-- ════════════════════════════════════════════════════════════════════════
       MODE A — FIXED (default): standard three-column flex layout
       ════════════════════════════════════════════════════════════════════════ -->
  @if (!store.loading()) {
    <main class="pres-fixed">

      <!-- Left -->
      <div class="pres-fixed__left" [style.width.px]="leftWidth()">
        <app-misc-pres-well-data />
        <app-picked-formation-tops />
      </div>

      <app-resize-divider (drag)="onLeftDrag($event)" />

      <!-- Center -->
      <div class="pres-fixed__center">

        <!-- Layout Toggle — top-right corner of diagram area, opens modal -->
        <button class="diagram-layout-toggle" (click)="toggleDraggable()"
          title="Open Free Layout"
          aria-label="Open free layout modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>

        @if (!store.isLoaded()) {
          <div class="empty-state">
            <div class="empty-state__icon">🛢</div>
            <p class="empty-state__text">Select a well above to render the wellbore diagram</p>
          </div>
        } @else {
          <div class="diagram-card">
            <div class="diagram-scroll-area">
              <app-depth-scale [totalDepth]="store.totalDepth()" [animTrigger]="store.animationTrigger()" />
              <app-well-bore-view [diagramData]="store.diagramData()" [animTrigger]="store.animationTrigger()" />
            </div>
            <app-wwells-logs-indicators />
          </div>
        }
      </div>

      <app-resize-divider (drag)="onRightDrag($event)" />

      <!-- Right -->
      <aside class="pres-fixed__right" [style.width.px]="rightWidth()">
        <app-active-wwell-map />
        <app-offset-wwells />
        <app-wwell-test-result />
      </aside>

    </main>
  }

  <!-- ════════════════════════════════════════════════════════════════════════
       MODE B — FREE LAYOUT — PrimeNG Dialog
       ════════════════════════════════════════════════════════════════════════ -->
  <p-dialog
    [visible]="draggableMode()"
    (visibleChange)="toggleDraggable()"
    [draggable]="true"
    [resizable]="false"
    [modal]="true"
    [style]="{ width: '92vw', height: '90vh' }"
    styleClass="pres-modal-dialog"
    appendTo="body"
  >
    <ng-template pTemplate="header">
      <span class="pres-modal__title">Daily Drilling Operations Summary</span>
    </ng-template>

    <div class="pres-modal__body">
      @if (!store.isLoaded()) {
        <div class="empty-state">
          <div class="empty-state__icon">🛢</div>
          <p class="empty-state__text">Select a well to render the diagram</p>
        </div>
      } @else {
        <div class="modal-diagram">
          <app-depth-scale [totalDepth]="store.totalDepth()" [animTrigger]="store.animationTrigger()" />
          <app-well-bore-view [diagramData]="store.diagramData()" [animTrigger]="store.animationTrigger()" />
        </div>
        <app-wwells-logs-indicators />
      }
    </div>

  </p-dialog>

</div>
