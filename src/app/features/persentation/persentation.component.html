<div class="presentation">

  <!--
    WellNameChipsComponent — SMART
    Injects WellStore directly, handles its own pagination calls.
    No inputs or outputs needed here.
  -->
  <app-well-name-chips />

  @if (store.error()) {
  <div class="error-banner" role="alert">
    <span>⚠</span> {{ store.error() }}
  </div>
  }

  <main class="presentation__diagram">

    <!--
      Left panel — SMART components, each inject WellStore internally.
      Zero prop drilling.
    -->
    <div class="w-1/3">
      <app-misc-pres-well-data />
      <br />
      <app-picked-formation-tops />
    </div>

    @if (!store.isLoaded() && !store.loading()) {
    <div class="empty-state">
      <div class="empty-state__icon">🛢</div>
      <p class="empty-state__text">Select a well above to render the wellbore diagram</p>
    </div>
    }

    <!--
      Center — DUMB D3 components.
      These receive data via @Input because they are pure renderers with
      imperative D3 logic — they must not know about the store.
      animTrigger is required so the effect() re-runs on new well select.
    -->
    <div class="w-2/3 ml-4 well-svg-div">
      @if (store.isLoaded()) {
      <div class="diagram-scroll">
        <app-depth-scale [totalDepth]="store.totalDepth()" [animTrigger]="store.animationTrigger()" />
        <app-well-bore-view [diagramData]="store.diagramData()" [animTrigger]="store.animationTrigger()" />
      </div>
      }
      <!-- SMART — injects store directly -->
      <app-wwells-logs-indicators />
    </div>

    <!-- Right sidebar — SMART components -->
    <aside class="presentation__sidebar presentation__sidebar--right">
      <app-active-wwell-map />
      <app-offset-wwells />
    </aside>

  </main>
</div>
