<div class="presentation">

  <!-- Well Name Chips Centered at Top -->
  <app-well-name-chips
    [wells]="store.uniqueWellNames()"
    [selectedEpANum]="store.selectedEpANum()"
    (chipSelected)="onWellSelected($event)"
  />

  @if (store.loading()) {
    <div class="loading-bar"></div>
  }

  <!-- Error Banner -->
  @if (store.error()) {
    <div class="error-banner" role="alert">
      <span>⚠</span> {{ store.error() }}
    </div>
  }

  <!-- Main Split Layout -->
  <main class="presentation__body">

    @if (!store.isLoaded() && !store.loading()) {
      <div class="empty-state">
        <div class="empty-state__icon">🛢</div>
        <p class="empty-state__text">Select a well above to render the wellbore data</p>
      </div>
    }

    @if (store.isLoaded()) {
      
      <!-- LEFT SIDEBAR: Metadata and Formations -->
      <aside class="presentation__sidebar">
        <app-misc-pres-well-data [data]="store.miscWellData()"></app-misc-pres-well-data>
         <app-picked-formation-tops [tops]="store.pickedFormations()"></app-picked-formation-tops>
      </aside>

      <!-- RIGHT SIDE: The Diagram -->
      <section class="presentation__diagram">
        <div class="diagram-scroll">
          <app-depth-scale
            [totalDepth]="store.totalDepth()"
            [animTrigger]="store.animationTrigger()"
          />
          <app-well-bore-view
            [diagramData]="store.diagramData()"
            [animTrigger]="store.animationTrigger()"
          />
        </div>
      </section>

    }

    <aside class="presentation__sidebar presentation__sidebar--right">
        <app-active-wwell-map></app-active-wwell-map>
        <app-offset-wwells [wells]="store.offsetWells()"></app-offset-wwells>
      </aside>

  </main>
</div>
