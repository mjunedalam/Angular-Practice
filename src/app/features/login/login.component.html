<section class="login">
  <div class="login__card">

    <!-- LEFT: Full bleed background image only -->
    <div class="login__left"></div>

    <!-- RIGHT: Original form, completely unchanged -->
    <div class="login__right">

      <div class="login__avatar-container">
        <div class="login__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21a8 8 0 0 0-16 0"/>
            <circle cx="12" cy="8" r="4"/>
          </svg>
        </div>
      </div>

      <h2 class="login__title">Log In</h2>

      <button
        mat-flat-button
        type="button"
        class="login__sso-btn"
        [disabled]="authStore.isLoading()"
        (click)="ssoLogin()"
      >
        Login with SSO
      </button>

      @if (!isCredentialsExpanded()) {
        <div class="login__or-divider">
          <mat-divider></mat-divider>
          <span class="login__or-text">OR</span>
          <mat-divider></mat-divider>
        </div>
      }

      <button
        type="button"
        class="login__toggle-btn"
        (click)="toggleCredentials()"
      >
        <span class="login__toggle-text">
          @if (!isCredentialsExpanded()) {
            Login with Credentials
          } @else {
            Cancel
          }
        </span>
        <svg class="login__toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          @if (!isCredentialsExpanded()) {
            <path d="m6 9 6 6 6-6" />
          } @else {
            <path d="m18 15-6-6-6 6" />
          }
        </svg>
      </button>

      @if (isCredentialsExpanded()) {
        <form class="login__form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>

          <div class="login__field">
            <label for="username" class="login__label">Email Address</label>
            <input
              id="username"
              type="email"
              formControlName="username"
              class="login__input"
              placeholder="Enter Your Email"
              [class.login__input--invalid]="isFieldInvalid('username')"
            />
            @if (isFieldInvalid('username')) {
              <div class="login__message">Email is required.</div>
            }
          </div>

          <div class="login__field">
            <label for="password" class="login__label">Password</label>
            <div class="login__password">
              <input
                id="password"
                [type]="hidePassword() ? 'password' : 'text'"
                formControlName="password"
                class="login__input"
                placeholder="Enter Password"
                [class.login__input--invalid]="isFieldInvalid('password')"
              />
              <button
                type="button"
                class="login__password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
              >
                @if (hidePassword()) {
                  Show
                } @else {
                  Hide
                }
              </button>
            </div>
            @if (isFieldInvalid('password')) {
              <div class="login__message">Password is required.</div>
            }
          </div>

          <div class="login__options">
            <div class="login__remember">
              <input type="checkbox" id="remember" class="login__checkbox">
              <label for="remember" class="login__remember-label">Remember Me</label>
            </div>
            <a href="#" class="login__forgot">Forgot Password?</a>
          </div>

          @if (authStore.error()) {
            <div class="login__message login__message--block">{{ authStore.error()! }}</div>
          }

          <button
            mat-flat-button
            type="submit"
            class="login__submit"
            [disabled]="loginForm.invalid || authStore.isLoading()"
          >
            Login
          </button>

          <div class="login__signup">
            <span class="login__signup-text">Don't have an account?</span>
            <a href="#" class="login__signup-link">Sign Up</a>
          </div>

        </form>
      }

    </div>
  </div>
</section>
