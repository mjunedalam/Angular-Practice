<section class="login">
  <div class="login__card">

    <!-- LEFT: Full bleed background image only -->
    <div class="login__left"></div>

    <!-- RIGHT: Original form, completely unchanged -->
    <div class="login__right">

      <div class="login__avatar-container">
        <p-avatar
          icon="pi pi-user"
          styleClass="login__avatar"
          shape="circle"
          size="xlarge"
        ></p-avatar>
      </div>

      <h2 class="login__title">Log In</h2>

      <button
        pButton
        type="button"
        class="login__sso-btn"
        [disabled]="authStore.isLoading()"
        (click)="ssoLogin()"
      >
        Login with SSO
      </button>

      @if (!isCredentialsExpanded()) {
        <div class="login__or-divider">
          <p-divider align="center" type="solid">
            <span class="login__or-text">OR</span>
          </p-divider>
        </div>
      }

      <button
        type="button"
        class="login__toggle-btn"
        (click)="toggleCredentials()"
      >
        <span class="login__toggle-text">
          @if (!isCredentialsExpanded()) {
            Login with Credentials
          } @else {
            Cancel
          }
        </span>
        <i class="pi" [class]="!isCredentialsExpanded() ? 'pi-chevron-down' : 'pi-chevron-up'"></i>
      </button>

      @if (isCredentialsExpanded()) {
        <form class="login__form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>

          <div class="login__field">
            <label for="username" class="login__label">Email Address</label>
            <input
              id="username"
              pInputText
              type="email"
              formControlName="username"
              class="login__input"
              placeholder="Enter Your Email"
              [class.ng-invalid]="isFieldInvalid('username')"
              [class.ng-dirty]="isFieldInvalid('username')"
            />
            @if (isFieldInvalid('username')) {
              <p-message severity="error" [text]="'Email is required.'" styleClass="login__message" />
            }
          </div>

          <div class="login__field">
            <label for="password" class="login__label">Password</label>
            <p-password
              id="password"
              formControlName="password"
              [feedback]="false"
              [toggleMask]="true"
              placeholder="Enter Password"
              styleClass="login__password"
              inputStyleClass="login__input"
              [class.ng-invalid]="isFieldInvalid('password')"
            />
            @if (isFieldInvalid('password')) {
              <p-message severity="error" [text]="'Password is required.'" styleClass="login__message" />
            }
          </div>

          <div class="login__options">
            <div class="login__remember">
              <input type="checkbox" id="remember" class="login__checkbox">
              <label for="remember" class="login__remember-label">Remember Me</label>
            </div>
            <a href="#" class="login__forgot">Forgot Password?</a>
          </div>

          @if (authStore.error()) {
            <p-message severity="error" [text]="authStore.error()!" styleClass="login__message login__message--block" />
          }

          <button
            pButton
            type="submit"
            class="login__submit"
            [disabled]="loginForm.invalid || authStore.isLoading()"
          >
            Login
          </button>

          <div class="login__signup">
            <span class="login__signup-text">Don't have an account?</span>
            <a href="#" class="login__signup-link">Sign Up</a>
          </div>

        </form>
      }

    </div>
  </div>
</section>
