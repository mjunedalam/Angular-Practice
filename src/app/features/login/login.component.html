<!-- login.component.html -->
<section class="login">
  <div class="login__shell">
    <div class="login__card">
      <!-- Avatar Section -->
      <div class="login__avatar">
        <p-avatar 
          icon="pi pi-user" 
          shape="circle" 
          size="xlarge" 
          styleClass="login__avatar-icon"
        ></p-avatar>
      </div>

      <!-- SSO Login Button - Always Visible -->
      <button
        pButton
        type="button"
        class="login__sso-btn"
        [disabled]="authStore.isLoading()"
        (click)="ssoLogin()"
      >
        Login with SSO
      </button>

      <!-- OR Divider - Only visible when credentials section is collapsed -->
      @if (!isCredentialsExpanded()) {
        <div class="login__or-divider">
          <p-divider align="center" type="solid">
            <span class="login__or-text">OR</span>
          </p-divider>
        </div>
      }

      <!-- Expand/Collapse Trigger for Credentials -->
      <button
        type="button"
        class="login__toggle-btn"
        (click)="toggleCredentials()"
      >
        <span class="login__toggle-text">
          @if (!isCredentialsExpanded()) {
            Login with Credentials
          } @else {
            Cancel
          }
        </span>
        <i class="pi" [class]="!isCredentialsExpanded() ? 'pi-chevron-down' : 'pi-chevron-up'"></i>
      </button>

      <!-- Credentials Form - Collapsible Section -->
      @if (isCredentialsExpanded()) {
        <form class="login__form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
          <div class="login__field">
            <span class="p-float-label">
              <input
                id="username"
                pInputText
                type="text"
                formControlName="username"
                class="login__input"
                [class.ng-invalid]="isFieldInvalid('username')"
                [class.ng-dirty]="isFieldInvalid('username')"
              />
              <label for="username">Username</label>
            </span>
            @if (isFieldInvalid('username')) {
              <p-message severity="error" [text]="'Username is required.'" styleClass="login__message" />
            }
          </div>

          <div class="login__field">
            <span class="p-float-label">
              <p-password
                id="password"
                formControlName="password"
                [feedback]="false"
                [toggleMask]="true"
                styleClass="login__password"
                inputStyleClass="login__input"
                [class.ng-invalid]="isFieldInvalid('password')"
              />
              <label for="password">Password</label>
            </span>
            @if (isFieldInvalid('password')) {
              <p-message severity="error" [text]="'Password is required.'" styleClass="login__message" />
            }
          </div>

          @if (authStore.error()) {
            <p-message severity="error" [text]="authStore.error()!" styleClass="login__message login__message--block" />
          }

          <button
            pButton
            type="submit"
            class="login__submit"
            [disabled]="loginForm.invalid || authStore.isLoading()"
          >
            Sign In
          </button>
        </form>
      }
    </div>
  </div>
</section>
