<section class="login">
  <!-- Full-page background image -->

  <!-- RIGHT: Login card floating over background -->
  <div class="login__right">
      <div class="login-header">
        <svg
          class="main-logo"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 0 156 162"
        >
          <defs>
            <filter
              id="a"
              x="28.387"
              y="32.445"
              width="95.296"
              height="95.34"
              filterUnits="userSpaceOnUse"
            >
              <feOffset dy="3" input="SourceAlpha" />
              <feGaussianBlur stdDeviation="3" result="b" />
              <feFlood flood-opacity="0.161" />
              <feComposite operator="in" in2="b" />
              <feComposite in="SourceGraphic" />
            </filter>
            <linearGradient
              id="c"
              x1="1.057"
              y1="2.52"
              x2="0.357"
              y2="-0.017"
              gradientUnits="objectBoundingBox"
            >
              <stop offset="0" stop-color="#5080f0" />
              <stop offset="1" stop-color="#18e3e3" />
            </linearGradient>
            <linearGradient
              id="d"
              x1="0.576"
              y1="1.13"
              x2="0.246"
              y2="-0.901"
              xlink:href="#c"
            />
            <clipPath id="f"><rect width="156" height="162" /></clipPath>
          </defs>
          <g id="e" clip-path="url(#f)">
            <g transform="translate(37.887 38.945)">
              <g
                transform="matrix(1, 0, 0, 1, -37.89, -38.95)"
                filter="url(#a)"
              >
                <path
                  d="M120.918,204.639a37.857,37.857,0,0,1-12.089,27.809,31.878,31.878,0,0,1-2.966,2.524,30.379,30.379,0,0,1-4.3,2.878,38.186,38.186,0,0,1-37.639,0,30.939,30.939,0,0,1-4.251-2.834c-1.018-.8-2.036-1.639-2.967-2.524a38.152,38.152,0,1,1,64.207-27.853Z"
                  transform="translate(-6.74 -127.52)"
                  fill="#fff"
                  stroke="#c9fffb"
                  stroke-width="1"
                />
              </g>
              <path
                d="M94.946,194.5a12.267,12.267,0,1,1-12.267-12.267A12.267,12.267,0,0,1,94.946,194.5Z"
                transform="translate(-44.53 -166.413)"
                fill="url(#c)"
              />
              <path
                d="M108.787,232.286a31.888,31.888,0,0,1-2.966,2.524,30.384,30.384,0,0,1-4.3,2.878,38.186,38.186,0,0,1-37.639,0,30.947,30.947,0,0,1-4.251-2.834c-1.018-.8-2.036-1.639-2.966-2.524C60.875,220.375,70.971,212,82.749,212,94.44,212,104.491,220.375,108.787,232.286Z"
                transform="translate(-44.579 -166.307)"
                fill="url(#d)"
              />
            </g>
          </g>
        </svg>
      </div>

      <div class="login-actions">
        <button class="btn-sso" (click)="ssoLogin()" [disabled]="authStore.isLoading()">
          <svg
            class="sso-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login with SSO
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <button
          class="btn-toggle"
          [class.active]="isCredentialsExpanded()"
          (click)="toggleCredentials()"
        >
          <svg
            class="lock-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Login with Credentials
          <svg
            class="chevron-icon"
            [class.rotated]="isCredentialsExpanded()"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        @if (isCredentialsExpanded()) {
          <div class="credentials-wrapper">
            <form
              [formGroup]="loginForm"
              (ngSubmit)="submit()"
              class="form-body"
            >
              <!-- Username field -->
              <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="username"
                    formControlName="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    [class.is-invalid]="isFieldInvalid('username')"
                  />
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                @if (isFieldInvalid('username')) {
                  <div class="error-msg">Username is required</div>
                }
              </div>

              <!-- Password field -->
              <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    id="password"
                    formControlName="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    [class.is-invalid]="isFieldInvalid('password')"
                  />
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </div>
                @if (isFieldInvalid('password')) {
                  <div class="error-msg">Password is required</div>
                }
              </div>

              <!-- Global error message from auth store -->
              @if (authStore.error()) {
                <div class="error-msg" style="margin-bottom: 1rem;">{{ authStore.error() }}</div>
              }

              <button
                type="submit"
                [disabled]="loginForm.invalid || authStore.isLoading()"
                class="btn-submit"
              >
                Sign In
              </button>
            </form>
          </div>
        }
      </div>
  </div>
</section>
