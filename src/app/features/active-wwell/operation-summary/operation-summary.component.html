<form [formGroup]="form">
  <div class="aw-section">
    <div class="well-header">Summary Of Operation</div>
    <div class="ops-grid">
      <div class="ops-label ops-label--expand" title="Double-click to expand" (dblclick)="openExpand('Operation Summary', form.get('wOpRmk'))">Operation</div>
      <textarea class="ops-textarea" rows="4" formControlName="wOpRmk" [readonly]="!canUpdate()"></textarea>
      <!-- <small class="red-color"
        *ngIf="!form.get('operations').valid && form.get('operations').errors && form.get('operations').touched">Field
        is required</small> -->
      <div class="ops-label ops-label--expand" title="Double-click to expand" (dblclick)="openExpand('Drilling Remarks', form.get('wDrlgSmryRmk'))">Drilling Remarks</div>
      <textarea class="ops-textarea" rows="4" formControlName="wDrlgSmryRmk" [readonly]="!canUpdate()"></textarea>
      <div class="ops-label ops-label--expand" title="Double-click to expand" (dblclick)="openExpand('Next 24 Hr Operation', form.get('nxt24HrPlanRmk'))">Next Operation</div>
      <textarea class="ops-textarea" rows="4" formControlName="nxt24HrPlanRmk" [readonly]="!canUpdate()"></textarea>
    </div>
  </div>
</form>
