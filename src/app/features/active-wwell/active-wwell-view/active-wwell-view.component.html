<form [formGroup]="form">
  <div class="active-wwell-page">
    <div
      class="active-wwell-loading-slot"
      [class.active-wwell-loading-slot--active]="loadingVisible()"
    >
      <div class="active-wwell-loading-bar"></div>
    </div>

    <div class="active-wwell-shell" [class.active-wwell-shell--loading]="loadingVisible()">
      <div class="active-wwell-sidebar">
        <div class="well-header well-list">Wells List</div>

        <div class="well-chip-list" role="listbox" aria-label="Wells">
          @for (well of visibleWells(); track well.epANum) {
            <button
              type="button"
              role="option"
              class="well-chip-item"
              [class.well-chip-item--active]="
                store.selectedEpANum() === well.epANum
              "
              [attr.aria-selected]="store.selectedEpANum() === well.epANum"
              (click)="onWellSelect(well.epANum)"
            >
              {{ well.wellName }}
            </button>
          }
        </div>

        @if (wells().length > 0) {
          <div class="well-list-actions">
            <span class="well-list-count">{{ wellListLabel() }}</span>
            @if (showWellPager()) {
              <div class="well-list-pager">
                <button
                  type="button"
                  class="well-page-btn"
                  [disabled]="!hasPrevWells()"
                  (click)="onPrevWellsPage()"
                >
                  Prev
                </button>
                <button
                  type="button"
                  class="well-page-btn well-page-btn--primary"
                  [disabled]="!hasNextWells()"
                  (click)="onNextWellsPage()"
                >
                  Next
                </button>
              </div>
            }
          </div>
        }

        <div class="active-wwell-sidebar__dept">
          Wellsite &amp; Water Operation Department
        </div>
      </div>

      <div class="active-wwell-content">
        <div class="aw-page-header">
          <div class="date-picker-section">
            <label class="date-picker-label" for="well-date-input">Date:</label>
            <div class="date-input-wrapper">
              <input
                id="well-date-input"
                type="text"
                class="date-picker-input"
                [value]="selectedDateString()"
                placeholder="YYYY-MM-DD"
                maxlength="10"
                (focus)="$any($event.target).select()"
                (input)="onDateAutoFormat($event)"
                (blur)="onDateTextCommit($any($event.target).value)"
                (keydown.enter)="
                  onDateTextCommit($any($event.target).value);
                  $any($event.target).blur()
                "
                aria-label="Select date for well data"
              />
              <button
                type="button"
                class="date-cal-btn"
                (click)="openNativePicker()"
                aria-label="Open calendar picker"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
              </button>
              <input
                #nativeDateInput
                type="date"
                class="date-native-hidden"
                [value]="selectedDateString()"
                [max]="maxDateString"
                (change)="onDateInputChange($any($event.target).value)"
                tabindex="-1"
                aria-hidden="true"
              />
            </div>
          </div>
          <div class="well-header">Single Water Well Review</div>
          <div class="aw-header-spacer"></div>
        </div>

        <div class="active-wwell-grid">
          <div class="active-wwell-main">
            @if (uiStore.isUpdating() || loadingVisible()) {
              <div class="aw-update-overlay" aria-hidden="true"></div>
              <div class="aw-loader-fixed" aria-hidden="true">
                <div class="aw-bars-loader">
                  <span class="aw-bar"></span>
                  <span class="aw-bar"></span>
                  <span class="aw-bar"></span>
                  <span class="aw-bar"></span>
                  <span class="aw-bar"></span>
                </div>
              </div>
            }
            <app-wwell-header></app-wwell-header>
            <app-database-info></app-database-info>
            <app-formation-tops-and-casing></app-formation-tops-and-casing>
            <app-casing-info></app-casing-info>
            <app-operation-summary></app-operation-summary>
            <app-wwell-test></app-wwell-test>
          </div>

          <div class="active-wwell-sidepanel">
            <app-file-upload
              [epANum]="store.selectedEpANum()"
              [date]="selectedDateString()"
              [canUpload]="canUpload()"
            ></app-file-upload>
          </div>
        </div>
      </div>
    </div>

    <div class="active-wwell-footer">
      <div class="footer-copy"></div>
      <div class="footer-legend">
        <span class="footer-legend__title">Data Source Legend</span>
        <div class="footer-legend__grid">
          <div class="footer-legend__item">
            <div class="legend-swatch legend-swatch--gray"></div>
            Drill Eye
          </div>
          <div class="footer-legend__item">
            <div class="legend-swatch legend-swatch--orange"></div>
            GIS
          </div>
          <div class="footer-legend__item">
            <div class="legend-swatch legend-swatch--blue"></div>
            IR
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
