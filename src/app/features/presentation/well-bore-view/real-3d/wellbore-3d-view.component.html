<div class="wellbore-3d-shell">
  <div #canvasHost class="wellbore-3d-host" role="img" aria-label="Wellbore 3D design view"></div>

  <div class="wellbore-3d-controls">
    <button type="button" class="wellbore-3d-btn" (click)="resetCamera()" title="Recenter camera" aria-label="Recenter camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9" />
        <path d="M3 5v6h6" />
      </svg>
    </button>
    <button type="button" class="wellbore-3d-btn" (click)="toggleAutoRotate()" title="Toggle auto-rotate" aria-label="Toggle auto-rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" />
      </svg>
    </button>
  </div>
</div>
