<div class="presentation">

  <!-- ── Chip bar ────────────────────────────────────────────────────────────── -->
  <div class="presentation__toolbar">
    <app-well-name-chips class="toolbar__chips" />
  </div>

  @if (store.error()) {
    <div class="pres-error-banner">{{ store.error()! }}</div>
  }

  <!-- ════════════════════════════════════════════════════════════════════════
       MODE A — FIXED (default): standard three-column flex layout
       ════════════════════════════════════════════════════════════════════════ -->
  <main class="pres-fixed">

    <!-- Left -->
    <div class="pres-fixed__left" [style.width.px]="leftWidth()">
      <app-misc-pres-well-data />
      <app-picked-formation-tops />
    </div>

    <app-resize-divider (dividerDrag)="onLeftDrag($event)" />

    <!-- Center -->
    <div class="pres-fixed__center">

      <!-- Layout Toggle — top-right corner of diagram area, opens modal -->
      <button class="diagram-layout-toggle" (click)="openDraggableDialog()"
        title="Open Free Layout"
        aria-label="Open free layout modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>

      @if (!store.isLoaded()) {
        <div class="empty-state">
          <div class="empty-state__icon">🛢</div>
          <p class="empty-state__text">Select a well above to render the wellbore diagram</p>
        </div>
      } @else {
        <div class="diagram-card">
          <div class="diagram-scroll-area">
            <app-depth-scale [totalDepth]="store.totalDepth()" [animTrigger]="store.animationTrigger()" />
            <app-well-bore-view [diagramData]="store.diagramData()" [animTrigger]="store.animationTrigger()" />
          </div>
          <app-wwells-logs-indicators />
        </div>
      }
    </div>

    <app-resize-divider (dividerDrag)="onRightDrag($event)" />

    <!-- Right -->
    <aside class="pres-fixed__right" [style.width.px]="rightWidth()">
      <app-active-wwell-map />
      <app-offset-wwells />
      <app-wwell-test-result />
      <app-active-wwell-docs-viewer />
    </aside>

  </main>

  <!-- ════════════════════════════════════════════════════════════════════════
       MODE B — FREE LAYOUT — PrimeNG Dialog
       ════════════════════════════════════════════════════════════════════════ -->
  <ng-template #freeLayoutDialog>
    <div class="pres-modal__header" mat-dialog-title>
      <span class="pres-modal__title">Daily Drilling Operations Summary</span>
      <button type="button" class="pres-modal__close" (click)="closeDraggableDialog()" aria-label="Close free layout modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <mat-dialog-content class="pres-modal__body">
      @if (!store.isLoaded()) {
        <div class="empty-state">
          <div class="empty-state__icon">🛢</div>
          <p class="empty-state__text">Select a well to render the diagram</p>
        </div>
      } @else {
        <div class="modal-diagram">
          <app-depth-scale [totalDepth]="store.totalDepth()" [animTrigger]="store.animationTrigger()" />
          <app-well-bore-view [diagramData]="store.diagramData()" [animTrigger]="store.animationTrigger()" />
        </div>
        <app-wwells-logs-indicators />
      }
    </mat-dialog-content>
  </ng-template>

</div>
