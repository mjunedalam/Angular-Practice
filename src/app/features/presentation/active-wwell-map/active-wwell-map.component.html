<div class="map-card">
  <div class="map-card__header">Active WWell Map</div>

  <div class="blueprint-view">
    <div #presMapViewNode class="wwell-map-canvas"></div>

    @if (!mapReady()) {
      <div class="map-loader">
        <span class="map-loader__spinner"></span>
        <span class="map-loader__label">Loading map…</span>
      </div>
    }

    @if (mapReady() && errorMessage()) {
      <div class="map-state">
        {{ errorMessage() }}
      </div>
    }
  </div>
</div>
