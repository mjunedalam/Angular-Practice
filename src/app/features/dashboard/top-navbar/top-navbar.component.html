<header class="top-navbar">

  <!-- Left: hamburger + logo -->
  <div class="top-navbar__brand">
    <button
      class="top-navbar__hamburger"
      (click)="toggleSidenav.emit()"
      [attr.aria-label]="sidenavCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [class.top-navbar__hamburger--active]="!sidenavCollapsed()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="top-navbar__logo">
      <div class="top-navbar__logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="16" cy="20" rx="9" ry="11" fill="url(#dropGrad)"/>
          <ellipse cx="16" cy="20" rx="5"  ry="7"  fill="rgba(255,255,255,0.25)"/>
          <path d="M16 4 C16 4 22 12 22 18" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="dropGrad" x1="16" y1="9" x2="16" y2="31" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0369a1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="top-navbar__logo-text">{{ logoText }}</span>
    </div>
  </div>

  <!-- Center: title -->
  <div class="top-navbar__title">
    <h1>{{ appTitle }}</h1>
  </div>

  <!-- Right: notifications + user -->
  <div class="top-navbar__user">

    <div class="top-navbar__notifications">
      <button
        class="top-navbar__icon-btn"
        aria-label="Notifications"
        [matBadge]="3"
        matBadgeColor="warn"
        [matBadgeOverlap]="true"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </button>
    </div>

    <div class="top-navbar__divider"></div>

    <div class="top-navbar__menu">
      <button
        type="button"
        class="top-navbar__menu-trigger"
        (click)="toggleUserMenu($event)"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Open user menu"
      >
        <div class="top-navbar__user-info">
          <span class="top-navbar__user-name">{{ auth.displayUsername() }}</span>
        </div>

        <div class="top-navbar__avatar" aria-hidden="true">{{ userInitial() }}</div>

        <svg class="top-navbar__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="top-navbar__menu-popup">
          <div class="top-navbar__profile-card">
            <div class="top-navbar__profile-head">
              <div class="top-navbar__profile-avatar" aria-hidden="true">{{ userInitial() }}</div>

              <div class="top-navbar__profile-copy">
                <span class="top-navbar__profile-label">Signed in as</span>
                <strong class="top-navbar__profile-name">{{ auth.displayUsername() }}</strong>
              </div>
            </div>

            <button
              type="button"
              class="top-navbar__logout-btn"
              (click)="logout($event)"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Logout
            </button>
          </div>
        </div>
      }
    </div>
  </div>

</header>
