<nav class="sidenav" [class.sidenav--collapsed]="collapsed()" aria-label="Main navigation">

  <!-- Section label (visible when expanded) -->


  <!-- Nav Items -->
  <ul class="sidenav__list" role="list">

    @for (item of navItems; track item.id) {
      <li class="sidenav__item">
        <button
          class="sidenav__btn"
          [class.sidenav__btn--active]="item.id === activeRoute()"
          (click)="onItemClick(item.id)"
          [attr.aria-current]="item.id === activeRoute() ? 'page' : null"
          [title]="collapsed() ? item.label : ''"
        >
          <!-- Icon -->
          <span class="sidenav__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              @for (pathD of item.icon.split(' M '); track $index) {
                @if ($index === 0) {
                  <path [attr.d]="pathD" />
                } @else {
                  <path [attr.d]="'M ' + pathD" />
                }
              }
            </svg>
          </span>

          <!-- Label (hidden when collapsed) -->
          @if (!collapsed()) {
            <span class="sidenav__label">{{ item.label }}</span>

            @if (item.badge) {
              <p-badge [value]="item.badge.toString()" severity="danger" class="sidenav__badge-prime" />
            }
          }

          <!-- Active indicator bar -->
          @if (item.id === activeRoute()) {
            <span class="sidenav__active-bar"></span>
          }
        </button>
      </li>
    }

  </ul>

  <!-- Bottom: Water drop decoration -->
  <div class="sidenav__footer">
    <div class="sidenav__water-logo">
      <svg viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="30" rx="13" ry="16" fill="url(#sideDropGrad)" opacity="0.85"/>
        <ellipse cx="20" cy="30" rx="7" ry="10" fill="rgba(255,255,255,0.18)"/>
        <path d="M20 6 C20 6 28 18 28 28" stroke="rgba(255,255,255,0.5)"
              stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="sideDropGrad" x1="20" y1="14" x2="20" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    @if (!collapsed()) {
      <span class="sidenav__footer-text">AGWA v2.4</span>
    }
  </div>

</nav>
