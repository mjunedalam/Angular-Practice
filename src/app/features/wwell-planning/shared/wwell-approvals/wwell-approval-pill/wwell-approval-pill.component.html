<button
  #pillOrigin="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  class="approval-pill"
  [class.approval-pill--muted]="!status()"
  [style.background]="status()?.bg ?? null"
  [style.color]="status()?.color ?? null"
  aria-haspopup="true"
  [attr.aria-expanded]="popoverOpen()"
  aria-label="Status and approval workflow"
  matTooltip="Status and approval workflow"
  matTooltipClass="ir-attachment-tooltip"
  (click)="toggle()"
>
  @if (status(); as meta) {
    <span class="approval-pill-dot" [style.background]="meta.dot"></span>
    <span class="approval-pill-status">{{ meta.label }}</span>
    <span class="approval-pill-divider" aria-hidden="true"></span>
  }
  <svg class="approval-pill-ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle class="approval-pill-ring-track" cx="20" cy="20" r="17" pathLength="100" />
    <circle
      class="approval-pill-ring-fill"
      cx="20"
      cy="20"
      r="17"
      pathLength="100"
      [style.strokeDashoffset]="100 - ringPercent()"
      [style.stroke]="chain().length ? chainColor() : null"
    />
  </svg>
  <span class="approval-pill-count">
    @if (sapWfId() === null) {
      <mat-icon>hourglass_empty</mat-icon>
    } @else {
      {{ approvedCount() }}/{{ chain().length }}
    }
  </span>
  <mat-icon class="approval-pill-chevron" [class.approval-pill-chevron--open]="popoverOpen() && !popoverClosing()">expand_more</mat-icon>
</button>

@if (sapWfId() !== null) {
  <button
    type="button"
    mat-icon-button
    class="approval-refresh-btn"
    aria-label="Refresh approval status"
    matTooltip="Refresh approval status"
    matTooltipClass="ir-attachment-tooltip"
    [disabled]="loading()"
    (click)="refresh.emit()"
  >
    <mat-icon [class.approval-spin]="loading()">refresh</mat-icon>
  </button>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="pillOrigin"
  [cdkConnectedOverlayOpen]="popoverOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="positions"
  (backdropClick)="close()"
  (detach)="popoverOpen.set(false)"
>
  <div class="approval-popover" animate.enter="approval-popover--enter" [class.approval-popover--closing]="popoverClosing()">
    <app-wwell-approval-workflow-card [ir]="approval()" [loading]="loading()" (refresh)="refresh.emit()" />
  </div>
</ng-template>
