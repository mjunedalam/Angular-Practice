<div class="wtt-group">
  <!-- The label names the action (not the state), so a screen reader hears what a press will do. -->
  <button
    type="button"
    mat-icon-button
    class="wtt wtt--theme"
    [class.wtt--dark]="theme.isDark()"
    [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    [matTooltip]="theme.isDark() ? 'Light theme' : 'Dark theme'"
    matTooltipClass="wp-tooltip"
    (click)="theme.toggle()"
  >
    <!-- One glyph that morphs rather than two that swap: the disc shrinks into the sun while the bite that made it a
         crescent slides away and the rays open; pressing again reverses it. Light shows the moon (a press goes dark). -->
    <svg class="wtt__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <mask id="wtt-moon-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect width="24" height="24" fill="#fff" />
        <circle class="wtt__bite" cx="12" cy="12" r="7" fill="#000" />
      </mask>
      <g mask="url(#wtt-moon-bite)">
        <circle class="wtt__disc" cx="12" cy="12" r="8" fill="currentColor" />
      </g>
      <g class="wtt__rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="1.5" x2="12" y2="3.5" />
        <line x1="12" y1="20.5" x2="12" y2="22.5" />
        <line x1="1.5" y1="12" x2="3.5" y2="12" />
        <line x1="20.5" y1="12" x2="22.5" y2="12" />
        <line x1="4.6" y1="4.6" x2="6" y2="6" />
        <line x1="18" y1="18" x2="19.4" y2="19.4" />
        <line x1="4.6" y1="19.4" x2="6" y2="18" />
        <line x1="18" y1="6" x2="19.4" y2="4.6" />
      </g>
    </svg>
  </button>

  <!-- A toggle, so its label stays the same and `aria-pressed` carries the state. -->
  <button
    type="button"
    mat-icon-button
    class="wtt wtt--legacy"
    [class.wtt--on]="theme.isLegacyShell()"
    aria-label="Legacy layout"
    [attr.aria-pressed]="theme.isLegacyShell()"
    [matTooltip]="theme.isLegacyShell() ? 'New layout' : 'Legacy layout'"
    matTooltipClass="wp-tooltip"
    (click)="toggleLegacy()"
  >
    <mat-icon>history</mat-icon>
  </button>
</div>
