<section class="kv-card">
  <h3 class="kv-card__title">{{ title() }}</h3>
  <dl class="kv-card__grid" [style.--kv-rows]="rowCount()">
    @for (row of rows(); track row.label) {
      <div class="kv-card__field" [attr.data-tone]="row.tone">
        <dt>{{ row.label }}</dt>
        <dd [class.kv-card__value--badge]="row.badge">{{ row.value }}</dd>
      </div>
    } @empty {
      <p class="kv-card__empty">No data recorded.</p>
    }
  </dl>
</section>
