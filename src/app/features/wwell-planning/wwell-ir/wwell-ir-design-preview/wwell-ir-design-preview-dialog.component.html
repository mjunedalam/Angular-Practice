<div class="wdp">
  <header class="wdp__header">
    <h3 class="wdp__title">
      Well Bore Design
      @if (data.wellName() || data.wellCode()) {
        <span class="wdp__title-well">— {{ data.wellName() || data.wellCode() }}</span>
      }
      @if (data.preparedDate()) {
        <span class="wdp__title-date">{{ data.preparedDate() }}</span>
      }
    </h3>
    <button type="button" mat-icon-button class="wdp__close" (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="wdp__body">
    <app-wwell-ir-design-preview
      class="wdp__preview"
      [formationTops]="data.formationTops()"
      [casing]="data.casing()"
      [surfaceElevationFtAsl]="data.surfaceElevationFtAsl()"
      [targetDepthFt]="data.targetDepthFt()"
      [showExpand]="false"
      [showHeader]="false"
    />
  </div>
</div>
