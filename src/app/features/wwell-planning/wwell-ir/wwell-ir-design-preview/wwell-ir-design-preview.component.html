<figure class="preview">
  @if ((showHeader() && (wellName() || wellCode())) || (hasWellboreData() && showExpand())) {
    <div class="preview__toolbar">
      <div class="preview__header-text">
        @if (showHeader() && (wellName() || wellCode())) {
          <span class="preview__header-eyebrow">Well Bore Design</span>
          <h4 class="preview__header-title">{{ wellName() || wellCode() }}</h4>
        }
      </div>
      @if (showHeader() && preparedDate()) {
        <span class="preview__header-date">{{ preparedDate() }}</span>
      }
      @if (hasWellboreData() && showExpand()) {
        <button
          type="button"
          mat-icon-button
          class="preview__expand"
          (click)="openInModal()"
          aria-label="Open well bore design in a larger view"
        >
          <mat-icon>open_in_full</mat-icon>
        </button>
      }
    </div>
  }

  <!-- Populated imperatively by D3 in the component's effect() — see wwell-ir-design-preview.renderer.ts -->
  <svg #canvas class="preview__svg" role="img" aria-label="Well bore design schematic"></svg>

  @if (!casing().length && !formationTops().length) {
    <figcaption class="preview__empty">No casing or formation data yet.</figcaption>
  }
</figure>
