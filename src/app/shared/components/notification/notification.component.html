<div class="notification-container">
  @for (n of svc.notifications(); track n.id) {
    <div
      class="notification"
      [class.error]="n.type === 'error'"
      [class.info]="n.type === 'info'"
    >
      <span class="message">{{ n.message }}</span>
      <button class="close" (click)="svc.dismiss(n.id)" aria-label="Dismiss">✕</button>
    </div>
  }
</div>
