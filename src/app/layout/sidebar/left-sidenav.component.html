<nav class="sidenav" [class.sidenav--collapsed]="collapsed()" aria-label="Main navigation">

  <!-- Nav Items -->
  <ul class="sidenav__list" role="list">

    @for (item of navItems; track item.id) {
      <li class="sidenav__item">
        <button
          class="sidenav__btn"
          [class.sidenav__btn--active]="item.id === activeRoute()"
          [class.sidenav__btn--locked]="isLocked(item)"
          (click)="onItemClick(item.id)"
          [attr.aria-current]="item.id === activeRoute() ? 'page' : null"
          [title]="collapsed() ? item.label : ''"
        >
          <!-- Icon -->
          <span class="sidenav__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              @for (pathD of item.icon.split(' M '); track $index) {
                @if ($index === 0) {
                  <path [attr.d]="pathD" />
                } @else {
                  <path [attr.d]="'M ' + pathD" />
                }
              }
            </svg>
          </span>

          <!-- Label (hidden when collapsed) -->
          @if (!collapsed()) {
            <span class="sidenav__label">{{ item.label }}</span>
          }

          <!-- Lock icon for restricted items -->
          @if (isLocked(item) && !collapsed()) {
            <span
              class="sidenav__lock"
              matTooltip="Access restricted — contact your administrator to request access to this module."
              matTooltipPosition="after"
              matTooltipClass="sidenav-lock-tooltip"
              [matTooltipShowDelay]="180"
              aria-label="Access restricted"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </span>
          }

          <!-- Active indicator bar -->
          @if (item.id === activeRoute()) {
            <span class="sidenav__active-bar"></span>
          }
        </button>
      </li>
    }

  </ul>

  <!-- Bottom: Water drop decoration -->
  <div class="sidenav__footer">
    <div
      class="sidenav__water-logo"
      [matTooltip]="collapsed() ? buildInfoTooltip : ''"
      matTooltipPosition="after"
      [matTooltipShowDelay]="180"
    >
      <svg viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="30" rx="13" ry="16" fill="url(#sideDropGrad)" opacity="0.85"/>
        <ellipse cx="20" cy="30" rx="7" ry="10" fill="rgba(255,255,255,0.18)"/>
        <path d="M20 6 C20 6 28 18 28 28" stroke="rgba(255,255,255,0.5)"
              stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="sideDropGrad" x1="20" y1="14" x2="20" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    @if (!collapsed()) {
      <div class="sidenav__build-info">
        <span class="sidenav__footer-text">AGWA</span>
        <span class="sidenav__build-branch" [title]="buildInfo.branch">{{ buildInfo.branch }}</span>
        <span class="sidenav__build-row">
          <span class="sidenav__build-hash">{{ shortHash }}</span>
          <span class="sidenav__build-dot">&middot;</span>
          <span class="sidenav__build-version">v{{ buildInfo.version }}</span>
          <span
            class="sidenav__build-env"
            [class.sidenav__build-env--prod]="buildInfo.env === 'PROD'"
          >{{ buildInfo.env }}</span>
        </span>
      </div>
    }
  </div>

</nav>
