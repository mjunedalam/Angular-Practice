<nav
  class="sidenav"
  [class.sidenav--collapsed]="collapsed()"
  aria-label="Main navigation"
>
  <!-- Nav Items -->
  <ul class="sidenav__list" role="list">
    @for (item of navItems; track item.id) {
      <li class="sidenav__item">
        <button
          class="sidenav__btn"
          [class.sidenav__btn--active]="item.id === activeRoute()"
          [class.sidenav__btn--locked]="isLocked(item)"
          (click)="onItemClick(item)"
          [attr.aria-current]="item.id === activeRoute() ? 'page' : null"
          [title]="collapsed() ? item.label : ''"
        >
          <!-- Icon -->
          <span class="sidenav__icon">
            @if (item.iconImage) {
              <span
                class="sidenav__icon-img"
                [style.-webkit-mask-image]="'url(' + item.iconImage + ')'"
                [style.mask-image]="'url(' + item.iconImage + ')'"
              ></span>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                @for (pathD of item.icon.split(" M "); track $index) {
                  @if ($index === 0) {
                    <path [attr.d]="pathD" />
                  } @else {
                    <path [attr.d]="'M ' + pathD" />
                  }
                }
              </svg>
            }
          </span>

          <!-- Label (hidden when collapsed) -->
          @if (!collapsed()) {
            <span class="sidenav__label">{{ item.label }}</span>
          }

          <!-- Lock icon for restricted items -->
          @if (isLocked(item) && !collapsed()) {
            <span
              class="sidenav__lock"
              matTooltip="Access restricted — contact your administrator to request access to this module."
              matTooltipPosition="after"
              matTooltipClass="sidenav-lock-tooltip"
              [matTooltipShowDelay]="180"
              aria-label="Access restricted"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
          }

          <!-- Active indicator bar -->
          @if (item.id === activeRoute()) {
            <span class="sidenav__active-bar"></span>
          }
        </button>
      </li>
    }
  </ul>

  <!-- Bottom: Brand + build info -->
  <div class="sidenav__footer">
    <!-- Brand row: water drop + wordmark -->
    <div class="sidenav__brand">
      <div
        class="sidenav__water-logo"
        tabindex="0"
        aria-label="Build information"
      >
        <img class="size-8" src="assets/images/agwa-logo.svg" alt="AGWA" />
        @if (collapsed()) {
          <div class="sidenav__build-popover" role="tooltip">
            <div class="sidenav__build-popover-title">Build Info</div>
            <div class="sidenav__build-popover-row">
              <span>Branch</span>
              <strong>{{ buildInfo.branch }}</strong>
            </div>
            <div class="sidenav__build-popover-row">
              <span>Commit</span>
              <strong>{{ shortHash }}</strong>
            </div>
            <div class="sidenav__build-popover-row">
              <span>Version</span>
              <strong>v{{ buildInfo.version }}</strong>
            </div>
            <div class="sidenav__build-popover-row">
              <span>Env</span>
              <strong>{{ buildInfo.env }}</strong>
            </div>
          </div>
        }
      </div>
      @if (!collapsed()) {
        <span class="sidenav__footer-text">AGWA</span>
        <span class="sidenav__build-version">v{{ buildInfo.version }}</span>
      }
    </div>
