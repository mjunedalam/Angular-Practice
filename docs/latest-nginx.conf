worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;
include /usr/share/nginx/modules/*.conf;
 
events {
    worker_connections 1024;
}
 
http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;
 
    # Rate Limiting Zone: 5 requests per second per client IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
   
    # Connection Limiting Zone (Circuit Breaking): Track concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
 
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
 
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html/browser;
 
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
       
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
 
        location /api/dailyoperations/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://agwa-dailyoperations.easd-agwa-dev.svc.cluster.local:80/;
        }
 
        location /api/email/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://agwa-integrations.easd-agwa-dev.svc.cluster.local:80/;
        }
 
        location /api/planning/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://agwa-planning.easd-agwa-dev.svc.cluster.local:80/;
        }
 
        location /api/sap/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://sap-service.easd-agwa-dev.svc.cluster.local:80/;
        }
 
        location /api/s3/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://s3-client-service.easd-agwa-dev.svc.cluster.local:80/;
        }
 
        location = /404.html {}
 
        location = /q/health/live {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }
 
        location = /q/health/ready {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }
 
        location = /q/health/started {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }
 
        location / {
            try_files $uri $uri/ /index.html;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }
}